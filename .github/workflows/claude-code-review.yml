name: Claude Code Review

# Automatically review every pull request with Claude (Max-subscription OAuth token).
# No github_token override -> posts as the Claude GitHub App ("Claude"), not github-actions[bot].
# NOTE: in app mode the action only runs when this file matches the default branch, so it does
# NOT review PRs that modify the workflow itself; it reviews normal PRs after this is merged.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@11ba60486e4aec9ddfeafcf4bb3f00b028ac2c16 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This repository is the canonical public documentation for MorphoDepot.
            Readers act on what it says, so accuracy matters more than style.

            Review this pull request for:
            - Claims that are wrong or out of date — storage limits, repository
              types, DOIs, membership rules, what is open to whom. Check them
              against the extension's behaviour and the other docs where you can.
            - Internal contradictions with the other documents in this repo.
            - Broken or misdirected links, including anchors and relative paths.
            - Instructions a new user could not actually follow: missing steps,
              undefined terms, or commands that assume prior setup.
            - Status markers that no longer match reality (DRAFT banners on adopted
              documents, or their absence on unadopted ones).

            Prefer a few high-confidence findings over many speculative ones.
            Follow the conventions in CLAUDE.md if present. Use inline comments for
            specific lines and a top-level comment for a brief summary.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
